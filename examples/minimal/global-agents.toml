# Example bundle manifest. Module order is output order and every module is
# mandatory. Sources resolve against this file's directory, never the process
# working directory.
#
# The companion format-2 lock pins each source's lexical path, byte size, and
# SHA-256 digest, so the committed lock is portable across checkout roots.
schema_version = 1
bundle_id = "example-global"
default_target = "~/.codex/AGENTS.md"

[[modules]]
id = "core"
source = "modules/core.md"

[[modules]]
id = "python"
source = "modules/python.md"
