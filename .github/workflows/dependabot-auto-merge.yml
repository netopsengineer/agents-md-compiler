---
# Queue verified Dependabot pull requests for GitHub-native squash auto-merge.
# This trusted scheduled workflow never checks out or executes pull-request content.
# Strict status checks in the active main-branch ruleset decide whether the exact
# queued head can merge.
name: dependabot-auto-merge

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  queue:
    name: queue verified update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - name: Verify the pull request and queue auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t numbers < <(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]") | .number'
          )
          if [ "${#numbers[@]}" -eq 0 ]; then
            echo "No open Dependabot pull requests."
            exit 0
          fi

          for number in "${numbers[@]}"; do
            pull="$(gh api "repos/${REPOSITORY}/pulls/${number}")"
            head_sha="$(jq -r '.head.sha' <<<"$pull")"

            jq -e \
              --arg repository "$REPOSITORY" \
              '.user.login == "dependabot[bot]" and
               .user.type == "Bot" and
               .state == "open" and
               .draft == false and
               .base.ref == "main" and
               .head.repo.full_name == $repository and
               (.head.ref | startswith("dependabot/"))' <<<"$pull" >/dev/null

            if [ "$(jq -r '.auto_merge != null' <<<"$pull")" = "true" ]; then
              echo "Pull request ${number} is already queued for auto-merge."
              continue
            fi

            gh pr merge "$number" \
              --repo "$REPOSITORY" \
              --auto \
              --squash \
              --match-head-commit "$head_sha"
          done
