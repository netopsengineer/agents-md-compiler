---
# Queue verified Dependabot pull requests for GitHub-native squash auto-merge.
# This trusted scheduled workflow never checks out or executes pull-request content.
# Strict status checks in the active main-branch ruleset decide whether the exact
# queued head can merge.
name: dependabot-auto-merge

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  queue:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    name: queue verified update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # frozen: v2.22.2
        with:
          egress-policy: audit

      - name: Verify the pull request and queue auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t numbers < <(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls?state=open&sort=created&direction=asc&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]") | .number'
          )
          if [ "${#numbers[@]}" -eq 0 ]; then
            echo "No open Dependabot pull requests."
            exit 0
          fi

          for number in "${numbers[@]}"; do
            pull="$(gh api "repos/${REPOSITORY}/pulls/${number}")"
            head_sha="$(jq -r '.head.sha' <<<"$pull")"

            jq -e \
              --arg repository "$REPOSITORY" \
              '.user.login == "dependabot[bot]" and
               .user.type == "Bot" and
               .state == "open" and
               .draft == false and
               .base.ref == "main" and
               .head.repo.full_name == $repository and
               (.head.ref | startswith("dependabot/"))' <<<"$pull" >/dev/null

            if [ "$(jq -r '.auto_merge != null' <<<"$pull")" = "true" ]; then
              echo "Pull request ${number} is already queued for auto-merge."
              break
            fi

            gh pr merge "$number" \
              --repo "$REPOSITORY" \
              --auto \
              --squash \
              --match-head-commit "$head_sha"
            # Serialize the queue: later updates wait for this exact head.
            break
          done

      - name: Load trusted queue controller
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Schedule/manual-main events supply trusted immutable code. Never
          # download a PR branch, artifact, command, or dependency here.
          gh api "repos/${REPOSITORY}/contents/.github/scripts/dependency-queue.mjs?ref=${TRUSTED_SHA}" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/dependency-queue.mjs"

      - name: Plan one stale dependency branch refresh
        id: plan
        env:
          GH_READ_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
        run: node "$RUNNER_TEMP/dependency-queue.mjs" plan

      - name: Mint the existing repository-scoped refresh token
        if: steps.plan.outputs.refresh == 'true'
        id: refresh-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # frozen: v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - name: Merge trusted main into the verified dependency branch
        if: steps.plan.outputs.refresh == 'true'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.refresh-token.outputs.token }}
          DEFAULT_BRANCH: main
        run: node "$RUNNER_TEMP/dependency-queue.mjs" apply

      - name: Verify main after the queue pass
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # repository_dispatch is intentionally not suppressed for GITHUB_TOKEN.
          # Receivers use their own default-branch event SHA, never client data.
          gh api --method POST "repos/${REPOSITORY}/dispatches" \
            -f event_type=dependency-main-verification
