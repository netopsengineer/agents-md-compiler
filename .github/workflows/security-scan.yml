---
# Security scanning. Split from validate.yml so a security finding is legible on its
# own and so the scheduled run does not re-run the whole acceptance gate.
#
# Every `uses:` is an immutable commit SHA with a `# frozen:` tag comment, resolved
# live and re-verified immediately before this file was written.
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, so new advisories, fixes, and expired exceptions are found promptly.
    # Minute chosen off the hour to avoid the top-of-hour scheduling crowd.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bandit, actionlint, and zizmor run through the same pinned hooks as the local
  # gate, so CI and a workstation enforce one rule set (PY-CI-001). These three hooks
  # are file-driven, so `--all-files` genuinely covers the tree.
  static-analysis:
    name: static analysis (bandit, actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # frozen: v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # frozen: v10.2.0
        with:
          version-file: uv.lock
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Push and pull-request runs restore the validate gate's cache. The
          # daily schedule is the sole writer when no validation run accompanies it.
          save-cache: ${{ github.event_name == 'schedule' }}

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Bandit
        run: uv run prek run bandit --all-files

      - name: actionlint
        run: uv run prek run actionlint --all-files

      - name: zizmor
        run: uv run prek run zizmor --all-files

  # The pinned gitleaks pre-commit hook runs `gitleaks git --pre-commit --staged`,
  # which is correct at commit time but scans nothing when no change is staged. A
  # "passed" line from that hook in CI would be false assurance, so this job runs
  # gitleaks itself over the full history and the full working tree.
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the signed checksums
      # file published with the release and re-verified immediately before this file
      # was written. The download is rejected unless it matches, so a replaced
      # release asset cannot inject a different scanner (PY-SEC-009).
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # frozen: v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          # Full history: a secret removed from the tip is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned gitleaks release
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "${base}/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the full commit history
        # --redact keeps a finding's value out of the public log (PY-SEC-003).
        run: ./gitleaks git --redact --verbose --no-banner .

      - name: Scan the working tree
        # `git` mode inspects commits; `dir` mode also catches an untracked or
        # generated file that never reached a commit.
        run: ./gitleaks dir --redact --verbose --no-banner .

  # Scan once, preserving its exact status and complete unsuppressed evidence.
  # The policy adapter accepts only explicit exact-scope, unexpired no-fix risks.
  osv-scanner:
    # Preserve the existing required status context without changing the ruleset.
    name: osv-scanner (repository and lockfile) / osv-scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # frozen: v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false

      - name: Validate the exception policy and scanner boundary
        run: |
          python3 scripts/advisory_policy.py
          python3 scripts/check_pins.py

      - name: Scan once with the pinned official CLI
        id: scan
        run: |
          set -euo pipefail
          image="$(awk '$1 == "FROM" { print $2 }' .github/security-scanner/Dockerfile)"
          if docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,src=$PWD,dst=/github/workspace,readonly" \
            --workdir /github/workspace "$image" \
            --config=.github/osv-scanner-empty.toml \
            --all-packages --format=json --recursive ./ \
            > raw-osv-results.json 2> raw-osv.log; then
            scan_exit=0
          else
            scan_exit=$?
          fi
          cat raw-osv.log
          printf '%s\n' "$scan_exit" > raw-osv-exit.txt
          echo "exit=$scan_exit" >> "$GITHUB_OUTPUT"

      - name: Enforce bounded risks against that exact result
        id: policy
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit }}
        run: |
          python3 scripts/advisory_policy.py \
            --report raw-osv-results.json --scan-exit "$SCAN_EXIT" \
            --output adjudicated-osv-results.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve blocking findings for the native reporter
        if: ${{ always() }}
        run: |
          if [ ! -f adjudicated-osv-results.json ] && [ -s raw-osv-results.json ]; then
            cp raw-osv-results.json adjudicated-osv-results.json
          fi

      - name: Report the adjudicated result without rescanning
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # frozen: v2.6.0
        with:
          scan-args: |-
            --new=adjudicated-osv-results.json
            --output=results.sarif
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload raw evidence and native SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # frozen: v7.0.1
        with:
          name: OSV Scanner SARIF file
          path: |
            raw-osv-results.json
            raw-osv.log
            raw-osv-exit.txt
            adjudicated-osv-results.json
            results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # frozen: v4.37.6
        with:
          sarif_file: results.sarif

  # `uv audit` reads the same lock as the OSV job through uv's own advisory client.
  # It is advisory here, not because a finding is acceptable, but because uv 0.12.3
  # prints "uv audit is experimental and may change without warning": the execution
  # plan gates this command on its interface being verified stable, and it is not.
  # The blocking advisory gate is the osv-scanner job above, which covers the same
  # resolved dependency set. Promote this to blocking when the command leaves preview.
  dependency-audit:
    name: dependency audit (uv audit, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # frozen: v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # frozen: v10.2.0
        with:
          version-file: uv.lock
          # uv audit reads the lock and advisory service; it does not install the
          # dependency environment and needs no package cache.
          enable-cache: false

      - name: Audit the locked resolution
        # --frozen audits exactly what is committed and never re-resolves.
        run: uv audit --frozen

  # Blocks a pull request that introduces a vulnerable or non-permitted dependency,
  # before it reaches the lock on main. Requires the dependency graph, which is on by
  # default for public repositories; on a private repository without GitHub Advanced
  # Security this job cannot run and must be removed or made advisory rather than
  # left failing.
  dependency-review:
    name: dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to read the dependency graph for both refs
      pull-requests: write # required to post the failure summary comment
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # frozen: v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # frozen: v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
          # This package ships zero runtime dependencies, so any new runtime
          # requirement is a deliberate decision that should be visible in review.
          license-check: true
