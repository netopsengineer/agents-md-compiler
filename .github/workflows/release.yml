---
# Release. Three mutually exclusive paths share one finalization contract.
#
# Bootstrap (workflow_dispatch, version 0.1.0 only). No prior release tag exists, so
# python-semantic-release has nothing to compare against:
#
#   exact clean main commit declaring 0.1.0
#     -> unprivileged build job runs every artifact gate and uploads one dist
#     -> protected `pypi` environment waits for operator review
#     -> minimal publish job downloads that same artifact and publishes via OIDC
#     -> finalize creates v0.1.0 and the GitHub release from the published commit
#
# Semantic (push to main, once the operator sets SEMANTIC_RELEASE_ENABLED):
#
#   the exact pushed change set contains a published package input
#     -> python-semantic-release stages only the release-owned file changes
#     -> the workflow validates, commits, and pushes exactly those changes
#     -> unprivileged build job validates and uploads the exact dist artifact
#     -> minimal publish job downloads and publishes that artifact
#     -> finalize creates the tag and GitHub release after PyPI succeeds
#
# Explicit release (workflow_dispatch `release`):
#
#   operator selects the semantic level for an intentional package publication
#     -> the semantic path above runs even when only repository files changed
#
# Recovery (workflow_dispatch `recover`):
#
#   operator supplies an already-published version and its prepared commit
#     -> verify main ancestry, commit metadata, and public PyPI artifacts
#     -> run only the idempotent tag and GitHub release finalization
#
# Invariants enforced below:
#   - default permissions are read-only; every elevation is job-scoped;
#   - the GitHub App token appears only where a protected-branch write needs it;
#   - `id-token: write` appears only in the publish job;
#   - the publish job performs no checkout, no install, and no build;
#   - the published bytes are the exact bytes the build job hashed;
#   - automatic releases require the exact push to change a package input;
#   - python-semantic-release creates no commit, tag, or GitHub release;
#   - every tag and GitHub release is created only after PyPI succeeds;
#   - a release in progress is never cancelled;
#   - an existing tag is never moved or replaced.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation: bootstrap 0.1.0, force a release, or recover finalization."
        required: true
        type: choice
        options:
          - bootstrap
          - release
          - recover
      bootstrap_version:
        description: "Must be exactly 0.1.0. Any other value is refused."
        required: false
        type: string
        default: "0.1.0"
      release_level:
        description: "Required for `release`; explicitly forces this semantic level."
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      recovery_version:
        description: "Required for `recover`; exact version already present on PyPI."
        required: false
        type: string
      recovery_commit:
        description: "Required for `recover`; 40-hex prepared release commit on main."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One release at a time, and never cancel one that is already running: a cancelled
  # run between publish and finalize would leave PyPI ahead of the repository.
  group: release
  cancel-in-progress: false

env:
  BOOTSTRAP_VERSION: "0.1.0"

jobs:
  # Decides which path this run takes, so no later job has to re-derive it from
  # event plumbing. Also the single place that refuses an unsupported request.
  resolve:
    name: resolve the release path
    runs-on: ubuntu-latest
    outputs:
      path: ${{ steps.resolve.outputs.path }}
      force: ${{ steps.resolve.outputs.force }}
      recovery_version: ${{ steps.resolve.outputs.recovery_version }}
      recovery_commit: ${{ steps.resolve.outputs.recovery_commit }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          # Automatic eligibility compares the exact before/after commits from
          # the push event. A shallow clone could omit the comparison base.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the requested operation
        id: decide
        env:
          # Inputs are read through the environment, never interpolated into the
          # script body, so no input value can be parsed as shell.
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.bootstrap_version }}
          RELEASE_LEVEL: ${{ inputs.release_level }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          RECOVERY_COMMIT: ${{ inputs.recovery_commit }}
          REF: ${{ github.ref }}
          HEAD_COMMIT: ${{ github.sha }}
          SEMANTIC_ENABLED: ${{ vars.SEMANTIC_RELEASE_ENABLED }}
        run: |
          set -euo pipefail

          if [ "$REF" != "refs/heads/main" ]; then
            echo "release runs only on main; got $REF" >&2
            exit 1
          fi

          requested_path=none
          force=
          recovery_version=
          recovery_commit=
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "bootstrap" ]; then
            # The only accepted bootstrap version is the literal below. An arbitrary
            # version string, ref, or shell fragment is refused here rather than
            # reaching a build or a publish.
            if [ "$REQUESTED_VERSION" != "$BOOTSTRAP_VERSION" ]; then
              echo "bootstrap accepts only version $BOOTSTRAP_VERSION," \
                   "got '$REQUESTED_VERSION'" >&2
              exit 1
            fi
            if [ "$SEMANTIC_ENABLED" = "true" ]; then
              echo "SEMANTIC_RELEASE_ENABLED is true, so bootstrap is already done." \
                   "Refusing to bootstrap a second time." >&2
              exit 1
            fi
            requested_path=bootstrap
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "release" ]; then
            if [ "$SEMANTIC_ENABLED" != "true" ]; then
              echo "SEMANTIC_RELEASE_ENABLED must be true for an explicit release." >&2
              exit 1
            fi
            case "$RELEASE_LEVEL" in
              patch|minor|major) ;;
              *) echo "release_level must be patch, minor, or major" >&2; exit 1 ;;
            esac
            requested_path=semantic
            force=$RELEASE_LEVEL
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "recover" ]; then
            if ! [[ "$RECOVERY_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "recovery_version must have stable form MAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if ! [[ "$RECOVERY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "recovery_commit must be a lowercase 40-hex commit SHA" >&2
              exit 1
            fi
            requested_path=recover
            recovery_version=$RECOVERY_VERSION
            recovery_commit=$RECOVERY_COMMIT
          elif [ "$EVENT" = "push" ]; then
            subject=$(git show -s --format=%s "$HEAD_COMMIT")
            case "$subject" in
              "chore(release): "*)
                echo "Prepared release commit push. The originating run owns it. No-op."
                ;;
              *)
                if [ "$SEMANTIC_ENABLED" = "true" ]; then
                  requested_path=semantic
                else
                  echo "SEMANTIC_RELEASE_ENABLED is not true. Nothing to release."
                fi
                ;;
            esac
          else
            echo "unsupported release operation: event=$EVENT mode=$MODE" >&2
            exit 1
          fi

          {
            echo "requested_path=$requested_path"
            echo "force=$force"
            echo "recovery_version=$recovery_version"
            echo "recovery_commit=$recovery_commit"
          } >>"$GITHUB_OUTPUT"
          echo "requested release path: $requested_path"

      - name: Evaluate automatic package-release eligibility
        id: package-policy
        if: steps.decide.outputs.requested_path == 'semantic' && github.event_name == 'push'
        env:
          AFTER: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git diff --name-only --no-renames -z "${BEFORE}..${AFTER}" |
            python3 scripts/release_policy.py \
              --before "$BEFORE" \
              --after "$AFTER" \
              --github-output "$GITHUB_OUTPUT"

      - name: Resolve the executable path
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_PATH: ${{ steps.decide.outputs.requested_path }}
          PACKAGE_CHANGES: ${{ steps.package-policy.outputs.package_changes }}
          FORCE: ${{ steps.decide.outputs.force }}
          RECOVERY_VERSION: ${{ steps.decide.outputs.recovery_version }}
          RECOVERY_COMMIT: ${{ steps.decide.outputs.recovery_commit }}
        run: |
          set -euo pipefail
          path=$REQUESTED_PATH
          if [ "$EVENT" = "push" ] && [ "$path" = "semantic" ] && \
             [ "$PACKAGE_CHANGES" != "true" ]; then
            path=none
            echo "The pushed change set contains no published package input. No-op."
          fi
          {
            echo "path=$path"
            echo "force=$FORCE"
            echo "recovery_version=$RECOVERY_VERSION"
            echo "recovery_commit=$RECOVERY_COMMIT"
          } >>"$GITHUB_OUTPUT"
          echo "resolved release path: $path"

  # Gate the requested source commit before any release preparation. The semantic
  # path repeats this gate below against the new version commit before building it.
  gate:
    name: gate the release commit
    needs: resolve
    if: needs.resolve.outputs.path == 'bootstrap' || needs.resolve.outputs.path == 'semantic'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # frozen: v9.0.0
        with:
          version-file: uv.lock
          # validate.yml owns the shared Linux cache write. Release jobs restore
          # that cache but never compete to reserve the same key.
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Aggregate gate
        run: uv run prek run --all-files --show-diff-on-failure --color always

      - name: Tests with coverage
        run: uv run pytest

      - name: Strict type check
        run: uv run pyright

      - name: Refuse an unclean tree
        run: git diff --exit-code

  # Bootstrap only. Everything that must be true about 0.1.0 before anything is built.
  verify-bootstrap:
    name: verify the bootstrap preconditions
    needs: [resolve, gate]
    if: needs.resolve.outputs.path == 'bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false

      - name: Declared version must be the bootstrap version, everywhere
        run: |
          set -euo pipefail
          declared=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          ")
          echo "pyproject project.version = $declared"
          if [ "$declared" != "$BOOTSTRAP_VERSION" ]; then
            echo "pyproject declares $declared, not $BOOTSTRAP_VERSION" >&2
            exit 1
          fi
          # The lock records the project's own version too. If it disagrees, the lock
          # is stale relative to the metadata and the artifact identity is ambiguous.
          locked=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('uv.lock').read_text(encoding='utf-8'))
          for package in data['package']:
              if package['name'] == 'agents-md-compiler':
                  print(package['version'])
                  break
          else:
              raise SystemExit('agents-md-compiler is absent from uv.lock')
          ")
          echo "uv.lock version = $locked"
          if [ "$locked" != "$BOOTSTRAP_VERSION" ]; then
            echo "uv.lock records $locked, not $BOOTSTRAP_VERSION" >&2
            exit 1
          fi

      - name: The release tag must not already exist
        # Publishing 0.1.0 twice is not recoverable on PyPI, and an existing tag means
        # a release already happened. Never move or replace it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${BOOTSTRAP_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists; refusing to bootstrap again" >&2
            exit 1
          fi
          echo "tag ${tag} is free"

  # Semantic path only. python-semantic-release stages the release-owned changes.
  # This job validates, commits, and pushes exactly those paths to protected main,
  # but creates no tag or GitHub release. Those public release claims are deferred
  # until the publish job proves PyPI accepted the exact artifact.
  semantic-release:
    name: prepare the semantic release
    needs: [resolve, gate]
    if: needs.resolve.outputs.path == 'semantic'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.psr.outputs.released }}
      version: ${{ steps.psr.outputs.version }}
      commit: ${{ steps.prepared.outputs.commit }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - name: Mint a short-lived App token
        id: app-token
        # A protected branch rejects a push from GITHUB_TOKEN, and a personal access
        # token would be long-lived and broadly scoped. This token is minted per run,
        # scoped to this repository, and limited to the permissions listed.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # frozen: v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          # Full history: the commit parser needs every commit since the last tag.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # This checkout must retain credentials, because this is the job that
          # pushes the version commit back to protected main.
          persist-credentials: true

      - name: Run python-semantic-release
        id: psr
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # frozen: v10.6.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Stage-only mode avoids the action's tagless commit_sha output defect.
          # The next step validates the staged paths before it creates and pushes
          # the prepared commit. Tags and releases remain finalizer-only state.
          commit: false
          tag: false
          push: false
          changelog: true
          vcs_release: false
          build: true
          force: ${{ needs.resolve.outputs.force }}
          # No release-worthy commit means no commit and `released=false`.
          # Downstream jobs skip instead of manufacturing an empty release.
          strict: false

      - name: Validate and push the prepared release
        id: prepared
        env:
          RELEASED: ${{ steps.psr.outputs.released }}
          VERSION: ${{ steps.psr.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASED" != "true" ]; then
            if ! git diff --quiet || ! git diff --cached --quiet ||
               [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "semantic-release reported no release but changed the checkout" >&2
              exit 1
            fi
            echo "commit=" >>"$GITHUB_OUTPUT"
            echo "No release-worthy commit since the last tag. No-op."
            exit 0
          fi

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "prepared version must have stable form MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "semantic-release reported a release without staging changes" >&2
            exit 1
          fi
          if ! git diff --quiet; then
            echo "semantic-release left unstaged tracked changes" >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "semantic-release left untracked files" >&2
            exit 1
          fi
          git diff --cached --name-only --no-renames -z |
            while IFS= read -r -d '' staged_path; do
              case "$staged_path" in
                CHANGELOG.md|pyproject.toml|uv.lock) ;;
                *)
                  echo "semantic-release staged forbidden path: $staged_path" >&2
                  exit 1
                  ;;
              esac
            done
          git diff --cached --check

          declared=$(python3 -c "
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          ")
          locked=$(python3 -c "
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('uv.lock').read_text(encoding='utf-8'))
          for package in data['package']:
              if package['name'] == 'agents-md-compiler':
                  print(package['version'])
                  break
          else:
              raise SystemExit('agents-md-compiler is absent from uv.lock')
          ")
          if [ "$declared" != "$VERSION" ] || [ "$locked" != "$VERSION" ]; then
            echo "prepared version mismatch: action=$VERSION" \
                 "pyproject=$declared lock=$locked" >&2
            exit 1
          fi

          tag="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}" ||
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} exists before PyPI publication; refusing to continue" >&2
            exit 1
          fi

          trigger_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          remote_commit=$(git rev-parse origin/main)
          if [ "$trigger_commit" != "$remote_commit" ]; then
            echo "origin/main changed during release preparation" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(release): ${VERSION}" \
            -m "Automatically generated by python-semantic-release"
          commit=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/main"
          pushed_commit=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$pushed_commit" != "$commit" ]; then
            echo "protected main does not match prepared commit $commit" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} appeared before PyPI publication" >&2
            exit 1
          fi
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "prepared version=$VERSION commit=$commit; tag deferred until PyPI"

  # Semantic path only. The version commit did not exist when `gate` ran, so repeat
  # the complete acceptance gate against the exact immutable commit that will be
  # built and published. A green parent commit is not evidence about generated
  # version and lock changes.
  gate-prepared:
    name: gate the prepared release commit
    needs: [resolve, semantic-release]
    if: needs.resolve.outputs.path == 'semantic' && needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.commit }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # frozen: v9.0.0
        with:
          version-file: uv.lock
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Aggregate gate
        run: uv run prek run --all-files --show-diff-on-failure --color always

      - name: Tests with coverage
        run: uv run pytest

      - name: Strict type check
        run: uv run pyright

      - name: Refuse an unclean tree
        run: git diff --exit-code

  # Unprivileged. Builds the artifact, proves it, and hands exactly one immutable
  # bundle forward. No token, no registry identity, no write permission.
  build:
    name: build and prove the artifact
    needs: [resolve, gate, verify-bootstrap, semantic-release, gate-prepared]
    # `always()` because each path leaves one of the two upstream jobs skipped, and a
    # skipped dependency would otherwise skip this job too. The conditions still
    # require the relevant path's own gate to have succeeded.
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (
        (needs.resolve.outputs.path == 'bootstrap' && needs.verify-bootstrap.result == 'success') ||
        (needs.resolve.outputs.path == 'semantic' && needs.semantic-release.result == 'success' && needs.semantic-release.outputs.released == 'true' && needs.gate-prepared.result == 'success')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          # For the semantic path this is the version commit python-semantic-release
          # just created, not the commit that triggered the run. For bootstrap the
          # two are the same commit. No tag exists yet on either path.
          ref: ${{ needs.resolve.outputs.path == 'semantic' && needs.semantic-release.outputs.commit || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # frozen: v9.0.0
        with:
          version-file: uv.lock
          # The release gate and validate gate already populated this key. The
          # artifact proof remains a cache consumer, never another writer.
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Record the artifact identity
        id: identity
        run: |
          set -euo pipefail
          mapfile -t metadata < <(python3 -c "
          import pathlib, re, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          requires_python = data['project']['requires-python']
          floor = re.fullmatch(r'>=(\d+)\.(\d+)', requires_python)
          if floor is None:
              raise SystemExit('requires-python must have form >=MAJOR.MINOR')
          print('.'.join(floor.groups()))
          ")
          version=${metadata[0]}
          python_floor=${metadata[1]}
          commit=$(git rev-parse HEAD)
          {
            echo "version=$version"
            echo "python_floor=$python_floor"
            echo "commit=$commit"
          } >>"$GITHUB_OUTPUT"
          echo "building $version on Python $python_floor from $commit"

      - name: Build the sdist and the wheel
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uv run twine check --strict dist/*

      - name: Inspect artifact contents
        run: uv run python scripts/inspect_dist.py inspect dist

      - name: Confirm the built version matches the declared version
        env:
          EXPECTED: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          # PY-PKG-004: the filename, the metadata, and the tag must agree before
          # anything is published under that name.
          for artifact in dist/*; do
            case "$(basename "$artifact")" in
              *"$EXPECTED"*) ;;
              *) echo "artifact $artifact does not carry version $EXPECTED" >&2; exit 1 ;;
            esac
          done
          echo "every artifact carries version $EXPECTED"

      - name: Smoke test the built wheel
        env:
          PYTHON_FLOOR: ${{ steps.identity.outputs.python_floor }}
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_FLOOR" fresh
          VIRTUAL_ENV=fresh uv pip install --no-cache dist/*.whl
          export PATH="$PWD/fresh/bin:$PATH"
          version=$(agents-md-compiler --version)
          bash scripts/smoke.sh "${RUNNER_TEMP}/release-smoke" "$version"

      - name: Write the SHA-256 inventory
        # The immutable handoff record. The publish job verifies the bytes it
        # downloaded against these digests before uploading anything.
        run: uv run python scripts/inspect_dist.py inventory dist --output dist/inventory.json

      - name: Upload the release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # frozen: v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/inventory.json
          if-no-files-found: error
          retention-days: 30

  # Privileged, and deliberately tiny. It downloads the artifact the build job
  # produced, re-verifies its digests, and uploads it. There is no checkout, no
  # dependency installation, no build step, and no cache anywhere in this job, so
  # nothing can alter the bytes between verification and publication (PY-PKG-008).
  publish:
    name: publish to PyPI
    needs: [resolve, build]
    # `always()` prevents the deliberately skipped non-selected release path from
    # activating GitHub's implicit success guard and skipping this transition.
    if: always() && needs.resolve.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # The protected environment is the operator's review point: the run waits here,
    # and the exact artifact can be downloaded and exercised before approval.
    environment:
      name: pypi
      url: https://pypi.org/project/agents-md-compiler/${{ needs.build.outputs.version }}
    permissions:
      # The only place in this repository that requests an OIDC token. Trusted
      # Publishing exchanges it for a short-lived, project-scoped upload credential,
      # so no PyPI password or long-lived API token exists to leak.
      id-token: write # required to mint the OIDC token PyPI exchanges for upload rights
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          # Audit rather than block. Block mode needs an explicit allowlist, and the
          # full set of destinations used by Trusted Publishing and PEP 740
          # attestation signing is not documented upstream. Guessing it would risk
          # failing a release for an unrelated reason. Tighten this to `block` using
          # the endpoint list observed in the first audited publish run.
          egress-policy: audit

      - name: Download the built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # frozen: v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Verify the downloaded bytes against the build inventory
        # Re-hashing here is what makes the handoff meaningful: it proves the bytes
        # about to be published are the bytes the build job gated, not merely an
        # artifact with the right name.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, sys

          dist = pathlib.Path("dist")
          inventory = json.loads((dist / "inventory.json").read_text(encoding="utf-8"))
          expected = {entry["name"]: entry["sha256"] for entry in inventory["artifacts"]}
          if not expected:
              sys.exit("inventory records no artifacts")

          present = sorted(p.name for p in dist.iterdir() if p.name != "inventory.json")
          if present != sorted(expected):
              sys.exit(f"artifact set changed: expected {sorted(expected)}, found {present}")

          for name, digest in sorted(expected.items()):
              actual = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              if actual != digest:
                  sys.exit(f"{name}: digest {actual} does not match recorded {digest}")
              print(f"verified {name} {digest}")
          PY

      - name: Remove the inventory before upload
        # twine would reject a non-distribution file in the upload directory.
        run: rm dist/inventory.json

      - name: Publish through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # frozen: v1.14.2
        with:
          packages-dir: dist
          # PEP 740 provenance. Defaults to true in this version; stated explicitly
          # so a future default change cannot silently drop attestations.
          attestations: true
          print-hash: true
          # Never skip: a name that already exists on the index means this release
          # was already published, and quietly succeeding would hide that.
          skip-existing: false

  # Recovery never builds or publishes. It proves the supplied commit is a prepared
  # release commit on main and that PyPI already contains the matching immutable
  # version. Only then may the shared idempotent finalizer create missing GitHub state.
  verify-recovery:
    name: verify published release recovery
    needs: resolve
    if: needs.resolve.outputs.path == 'recover'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main ancestry, metadata, and PyPI publication
        env:
          COMMIT: ${{ needs.resolve.outputs.recovery_commit }}
          VERSION: ${{ needs.resolve.outputs.recovery_version }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$COMMIT" HEAD; then
            echo "$COMMIT is not an ancestor of the current main branch" >&2
            exit 1
          fi
          subject=$(git show -s --format=%s "$COMMIT")
          if [ "$subject" != "chore(release): $VERSION" ]; then
            echo "$COMMIT is not the prepared release commit for $VERSION" >&2
            exit 1
          fi
          declared=$(git show "$COMMIT:pyproject.toml" | python3 -c "
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())['project']['version'])
          ")
          if [ "$declared" != "$VERSION" ]; then
            echo "$COMMIT declares version $declared, not $VERSION" >&2
            exit 1
          fi
          locked=$(git show "$COMMIT:uv.lock" | python3 -c "
          import sys, tomllib
          data = tomllib.loads(sys.stdin.read())
          for package in data['package']:
              if package['name'] == 'agents-md-compiler':
                  print(package['version'])
                  break
          else:
              raise SystemExit('agents-md-compiler is absent from uv.lock')
          ")
          if [ "$locked" != "$VERSION" ]; then
            echo "$COMMIT locks version $locked, not $VERSION" >&2
            exit 1
          fi

          python3 - "$VERSION" <<'PY'
          import base64
          import hashlib
          import json
          import sys
          import urllib.parse
          import urllib.request

          version = sys.argv[1]
          url = f"https://pypi.org/pypi/agents-md-compiler/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              document = json.load(response)
          if document["info"]["version"] != version:
              raise SystemExit("PyPI returned a different version")
          files = document["urls"]
          package_types = sorted(item["packagetype"] for item in files)
          if package_types != ["bdist_wheel", "sdist"]:
              raise SystemExit(f"unexpected PyPI artifact set: {package_types}")
          for item in sorted(files, key=lambda value: value["filename"]):
              filename = item["filename"]
              digest = item["digests"]["sha256"]
              if len(digest) != hashlib.sha256().digest_size * 2:
                  raise SystemExit(f"invalid SHA-256 for {filename}")
              with urllib.request.urlopen(item["url"], timeout=30) as response:
                  actual = hashlib.sha256(response.read()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"downloaded digest mismatch for {filename}")

              encoded_filename = urllib.parse.quote(filename, safe="")
              provenance_url = (
                  "https://pypi.org/integrity/agents-md-compiler/"
                  f"{version}/{encoded_filename}/provenance"
              )
              with urllib.request.urlopen(provenance_url, timeout=30) as response:
                  provenance = json.load(response)
              bundles = provenance["attestation_bundles"]
              if len(bundles) != 1:
                  raise SystemExit(f"unexpected provenance bundle count for {filename}")
              publisher = bundles[0]["publisher"]
              expected_publisher = {
                  "environment": "pypi",
                  "kind": "GitHub",
                  "repository": "netopsengineer/agents-md-compiler",
                  "workflow": "release.yml",
              }
              if publisher != expected_publisher:
                  raise SystemExit(f"unexpected publisher for {filename}: {publisher}")
              attestations = bundles[0]["attestations"]
              if len(attestations) != 1:
                  raise SystemExit(f"unexpected attestation count for {filename}")
              statement_bytes = base64.b64decode(
                  attestations[0]["envelope"]["statement"], validate=True
              )
              statement = json.loads(statement_bytes)
              expected_subject = [{"name": filename, "digest": {"sha256": digest}}]
              if statement["subject"] != expected_subject:
                  raise SystemExit(f"attested subject mismatch for {filename}")
              print(f"published and attested {filename} {digest}")
          PY

  # Shared by bootstrap, semantic release, and finalize-only recovery. Normal paths
  # require successful publication in this run. Recovery requires independent proof
  # that publication already succeeded, and never invokes the publish job again.
  finalize:
    name: finalize the published release
    needs: [resolve, build, publish, verify-recovery]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (
        (
          (needs.resolve.outputs.path == 'bootstrap' || needs.resolve.outputs.path == 'semantic') &&
          needs.build.result == 'success' &&
          needs.publish.result == 'success'
        ) ||
        (
          needs.resolve.outputs.path == 'recover' &&
          needs.verify-recovery.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      # Creating a tag and a release is a contents write. It is not a protected-branch
      # push, so the run's own token suffices and no App token is minted here.
      contents: write # required to create the release tag and the GitHub release
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # frozen: v2.20.1
        with:
          egress-policy: audit

      - name: Select the published identity
        id: identity
        env:
          PATH_KIND: ${{ needs.resolve.outputs.path }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
          BUILT_VERSION: ${{ needs.build.outputs.version }}
          RECOVERY_COMMIT: ${{ needs.resolve.outputs.recovery_commit }}
          RECOVERY_VERSION: ${{ needs.resolve.outputs.recovery_version }}
        run: |
          set -euo pipefail
          if [ "$PATH_KIND" = "recover" ]; then
            commit=$RECOVERY_COMMIT
            version=$RECOVERY_VERSION
          else
            commit=$BUILT_COMMIT
            version=$BUILT_VERSION
          fi
          {
            echo "commit=$commit"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"
          echo "finalizing version=$version commit=$commit after PyPI publication"

      - name: Create the tag if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            read -r object_type object_sha <<<"$tag_ref"
            case "$object_type" in
              commit) existing=$object_sha ;;
              tag)
                existing=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '.object.sha')
                ;;
              *) echo "tag ${tag} has unsupported target type $object_type" >&2; exit 1 ;;
            esac
            echo "tag ${tag} already resolves to ${existing}"
            if [ "$existing" != "$COMMIT" ]; then
              echo "it points at a different commit than the published one" \
                   "(${COMMIT}); refusing to move it" >&2
              exit 1
            fi
            echo "it already points at the published commit; nothing to do"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${COMMIT}"
            echo "created ${tag} at ${COMMIT}"
          fi

      - name: Create the GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; nothing to do"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${tag}" \
            -f "name=${tag}" \
            -f "body=agents-md-compiler ${VERSION} published to PyPI through Trusted Publishing. See CHANGELOG.md." \
            -F "draft=false" \
            -F "prerelease=false"
          echo "created release ${tag}"
